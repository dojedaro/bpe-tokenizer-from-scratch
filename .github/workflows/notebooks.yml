name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" nbformat
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # The notebook downloads WikiText-2, so CI only checks that it is valid and has no syntax errors
      # or undefined names.
      - name: Notebook is valid
        run: python -c "import nbformat; nbformat.validate(nbformat.read('bpe_tokenizer_wikitext2.ipynb', as_version=4))"
      - run: ruff check --select E9,F63,F7,F82 --output-format github --no-force-exclude bpe_tokenizer_wikitext2.ipynb
